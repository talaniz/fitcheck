[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fitcheck"
version = "0.1.0"
description = "CLI tool for checking your fit against job postings."
requires-python = ">=3.10"
dependencies = [
    "ollama",
    "pyperclip",
]

[project.scripts]
fitcheck = "main:main"

[tool.setuptools]
py-modules = ["main"]
